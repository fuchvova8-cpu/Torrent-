
name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find . -type f -name settings.gradle \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -type f -name settings.gradle.kts \
              -not -path "*/.gradle/*" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found."
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found in $PROJECT_DIR"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InWebViewTV-Test
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
