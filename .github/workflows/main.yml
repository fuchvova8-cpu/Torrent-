
name: Build InWebView TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Получаем файлы репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Распаковываем ZIP, если архив загружен в репозиторий
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive: $ZIP_FILE"
            mkdir -p _extracted_project
            unzip -o "$ZIP_FILE" -d _extracted_project
          else
            echo "No ZIP archive found. Searching existing files."
          fi

      # 4. Находим Android SDK
      - name: Configure Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # 5. Принимаем лицензии
      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      # 6. Устанавливаем необходимые компоненты SDK
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # 7. Автоматически находим проект
      - name: Find Android project
        run: |
          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            echo "Repository structure:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found in $PROJECT_DIR"
            echo "Project files:"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

      # 8. Собираем APK
      - name: Build Android TV APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      # 9. Проверяем APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 10. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InWebViewTV-Test
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
