
name: Build InWebView TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Устанавливаем Gradle 8.9 без gradlew
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Распаковываем архив
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive: $ZIP_FILE"
            mkdir -p _extracted_project
            unzip -o "$ZIP_FILE" -d _extracted_project
          else
            echo "No ZIP archive found."
          fi

      # Настраиваем Android SDK
      - name: Configure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # Ищем проект
      - name: Find Android project
        run: |
          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      # Собираем без gradlew
      - name: Build Android TV APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug --stacktrace

      # Проверяем APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          ls -lh "$APK"

      # Загружаем результат
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InWebViewTV-Test
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
