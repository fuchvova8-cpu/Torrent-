
name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Locate project
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f InWebViewTV_Test/settings.gradle ]; then
            echo "PROJECT_DIR=InWebViewTV_Test" >> $GITHUB_ENV
          else
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InWebViewTV-Test
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
